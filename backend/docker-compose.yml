services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aether_pgdata:/var/lib/postgresql/data
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./migrations/002_seed_dev.sql:/docker-entrypoint-initdb.d/002_seed_dev.sql:ro
      - ./migrations/003_mobile.sql:/docker-entrypoint-initdb.d/003_mobile.sql:ro
      - ./migrations/004_seed_mobile.sql:/docker-entrypoint-initdb.d/004_seed_mobile.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aether"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: dart:stable
    working_dir: /app
    volumes:
      - ./:/app
      - aether_dart_tool:/app/.dart_tool
    command: sh -c "dart pub get && dart run bin/server.dart"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@banco:5432/aether?sslmode=disable&max_connection_count=10
      JWT_SECRET: desenvolvimento-chave-aether-altere-em-producao
      PORT: 8080
      APP_ENV: development
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ACE}
      SMTP_SSL: ${SMTP_SSL:-false}
    ports:
      - "8080:8080"
    depends_on:
      banco:
        condition: service_healthy

volumes:
  aether_pgdata:
  aether_dart_tool:
