components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - erro
      properties:
        erro:
          type: string
          example: Descrição amigável do problema.
    LoginRequest:
      type: object
      required:
      - email
      - senha
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
          minLength: 8
    StudentCreateRequest:
      type: object
      required:
      - nome
      - email
      - senha
      - cpf
      - dataNascimento
      - escolaId
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        senha:
          type: string
          format: password
        cpf:
          type: string
          example: '12345678901'
        dataNascimento:
          type: string
          format: date
        escolaId:
          type: string
          format: uuid
        matricula:
          type: string
        genero:
          type: string
        telefone:
          type: string
    StudentUpdateRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        cpf:
          type: string
        dataNascimento:
          type: string
          format: date
        escolaId:
          type: string
          format: uuid
        matricula:
          type: string
        genero:
          type: string
        telefone:
          type: string
    DocumentUploadRequest:
      type: object
      required:
      - tipoDocumentoId
      - nomeArquivo
      - mimeType
      properties:
        tipoDocumentoId:
          type: string
          format: uuid
        nomeArquivo:
          type: string
        mimeType:
          type: string
          example: application/pdf
        arquivoBase64:
          type: string
          format: byte
          description: Conteúdo Base64. Use este campo ou urlArquivo.
        urlArquivo:
          type: string
          format: uri
        tamanhoBytes:
          type: integer
          minimum: 1
    DocumentValidationRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - APROVADA
          - REJEITADA
          - CORRECAO_SOLICITADA
        justificativa:
          type: string
        observacao:
          type: string
    CompetitionRequest:
      type: object
      required:
      - nome
      properties:
        nome:
          type: string
        descricao:
          type: string
        tipo:
          type: string
          example: JOGOS_ESCOLARES
        abrangencia:
          type: string
        formato:
          type: string
          enum:
          - PONTOS_CORRIDOS
          - MATA_MATA
          - GRUPOS_E_MATA_MATA
        modalidadeId:
          type: string
          format: uuid
          nullable: true
        categoriaId:
          type: string
          format: uuid
          nullable: true
        limiteTimes:
          type: integer
          minimum: 2
        dataInicio:
          type: string
          format: date
          nullable: true
        dataFim:
          type: string
          format: date
          nullable: true
        dataLimiteInscricao:
          type: string
          format: date-time
          nullable: true
    CompetitionDeleteRequest:
      type: object
      required:
      - justificativa
      properties:
        justificativa:
          type: string
          minLength: 3
    EditionRequest:
      type: object
      required:
      - ano
      - nome
      - dataInicio
      - dataFim
      properties:
        ano:
          type: integer
        nome:
          type: string
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
        copiarConfiguracoes:
          type: boolean
          default: false
    CompetitionModalityRequest:
      type: object
      properties:
        jogadoresMin:
          type: integer
        jogadoresMax:
          type: integer
        limiteTimes:
          type: integer
        regras:
          type: object
          additionalProperties: true
    CompetitionCategoryRequest:
      type: object
      properties:
        dataReferencia:
          type: string
          format: date
        serieMin:
          type: integer
        serieMax:
          type: integer
        criterios:
          type: object
          additionalProperties: true
    PhasesRequest:
      type: object
      required:
      - fases
      properties:
        fases:
          type: array
          items:
            type: object
            required:
            - nome
            - ordem
            - tipo
            properties:
              id:
                type: string
                format: uuid
              nome:
                type: string
              ordem:
                type: integer
              tipo:
                type: string
              quantidadeGrupos:
                type: integer
              classificados:
                type: integer
              configuracao:
                type: object
                additionalProperties: true
    BracketRequest:
      type: object
      properties:
        faseId:
          type: string
          format: uuid
        metodo:
          type: string
          enum:
          - SORTEIO
          - ALFABETICO
        semente:
          type: integer
        substituir:
          type: boolean
    MatchGenerationRequest:
      type: object
      properties:
        faseId:
          type: string
          format: uuid
        modo:
          type: string
          enum:
          - TURNO_UNICO
          - IDA_VOLTA
        substituir:
          type: boolean
    CompetitionCalendarRequest:
      type: object
      required:
      - partidas
      properties:
        partidas:
          type: array
          items:
            $ref: '#/components/schemas/MatchScheduleItem'
    MatchScheduleItem:
      type: object
      required:
      - partidaId
      - dataHora
      properties:
