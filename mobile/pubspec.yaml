name: aether_mobile
description: Aplicativo móvel do Sistema de Gestão Esportiva Escolar ACE.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/ace_logo.png
    - assets/images/ace_app_icon.png
    - assets/images/ace_wordmark_orange.png
